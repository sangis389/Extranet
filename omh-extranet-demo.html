/* ---------- shared bits styled like current extranet ---------- */

/* ---------- Dashboard (계기반) ---------- */

/* ---------- Monthly Brief (신규 추가) ---------- */
function Brief({onOpenProposal, notify}){
  const [sel,setSel] = useState(BRIEFS[0]);
  const [pub, setPub] = useState(false);
  return (
    <div className="fade">
      <div className="flex items-center gap-2 mb-3">
        <h2 className="text-lg font-bold">Monthly Brief</h2>
        <span className="text-[10px] font-bold text-white bg-green-600 px-1.5 py-0.5 rounded">NEW</span>
        <span className="text-sm text-mute">OHMY Monthly Brief · Vietnam Inbound</span>
        <div className="ml-auto flex gap-2">
          <button onClick={()=>setPub(true)} className="px-3 py-1.5 rounded text-xs font-semibold bg-white border border-line hover:bg-page">📧 발행 &amp; 메일 발송</button>
          <button onClick={onOpenProposal} className="px-3 py-1.5 rounded text-xs font-semibold bg-omg text-white hover:bg-omgdeep">💡 이 브리프로 프로모션 제안</button>
        </div>
      </div>
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div className="space-y-2">
          {BRIEFS.map(b=>{
            const on = sel.file===b.file;
            return (
              <button key={b.file} onClick={()=>setSel(b)} className={cls("w-full text-left p-3 rounded border transition bg-white", on?"border-omg ring-1 ring-omg":"border-line hover:bg-page")}>
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold text-omgdeep">{b.vol}</span>
                  <span className="num text-[11px] text-mute">{b.date}</span>
                </div>
                <p className="font-bold text-sm mt-1 leading-snug">{b.title}</p>
                <div className="flex flex-wrap gap-1 mt-1.5">{b.tags.map(t=><span key={t} className="text-[10px] bg-page text-mute px-1.5 py-0.5 rounded border border-line">{t}</span>)}</div>
                <p className="text-[11px] text-mute mt-1.5">{b.region} · {b.pages}p</p>
              </button>
            );
          })}
        </div>
        <div className="lg:col-span-2 bg-white border border-line rounded overflow-hidden flex flex-col">
          <div className="flex items-center justify-between p-3 border-b border-line">
            <div><span className="text-xs font-bold text-omgdeep">{sel.vol}</span><p className="font-bold text-sm leading-tight">{sel.title}</p></div>
            <div className="flex gap-2 shrink-0">
              <a href={sel.file} target="_blank" rel="noreferrer" className="px-3 py-1.5 rounded text-xs font-semibold bg-white border border-line hover:bg-page">새 탭 ↗</a>
              <a href={sel.file} download className="px-3 py-1.5 rounded text-xs font-semibold bg-omg text-white hover:bg-omgdeep">다운로드</a>
            </div>
          </div>
          <iframe title={sel.vol} src={sel.file} className="w-full bg-page" style={{height:"680px",border:"0"}}></iframe>
        </div>
      </div>
      {pub && <PublishModal onClose={()=>setPub(false)} notify={notify} />}
    </div>
  );
}

function ScopeTable(){
  return (
    <table className="w-full text-xs num whitespace-nowrap">
      <thead className="bg-page text-mute"><tr>
        <th className="text-left px-2 py-1.5 font-semibold">룸타입</th>
        <th className="text-left px-2 py-1.5 font-semibold">요금제</th>
        <th className="text-right px-2 py-1.5 font-semibold">기본요금</th>

        <th className="text-right px-2 py-1.5 font-semibold">+연박 −5%(3박↑)</th>

      </tr></thead>
      <tbody className="divide-y divide-line">
        {SCOPE.flatMap((r,ri)=> r.plans.map((pl,pi)=>{
          const eb=Math.round(pl.base*0.93), los=Math.round(eb*0.95);

            <tr key={ri+"-"+pi} className={pl.eligible?"":"text-mute"}>

              <td className="px-2 py-1.5 text-center">{pl.eligible?<span className="text-green-700 font-semibold">적용</span>:<span className="text-mute">제외 · {pl.reason}</span>}</td>

}

}

    { rate:"Shared",    code:"892816", room:"City View Standard Double", plan:"Ladies Plan" },
    { rate:"Shared",    code:"887666", room:"Garden View Standard Twin", plan:"Free Breakfast" },
    { rate:"Shared",    code:"885973", room:"Garden View Standard Twin", plan:"Late Check-in" },

  const PROMOS = [
    { type:"얼리버드 (정률)", val:"-7%" },

          <OBtn onClick={onOpenProposal}>＋ Brief 제안 적용</OBtn>
        </div>
      </div>
      {applied ? (
        <>
        <div className="bg-green-50 border border-green-200 rounded px-4 py-2.5 text-sm text-green-800 flex items-center justify-between flex-wrap gap-2">
          <span>✓ Monthly Brief 제안이 프로모션으로 <b>설정 완료(판매 개시)</b> 되었습니다.</span>
          <span className="text-[11px] font-bold bg-green-600 text-white px-2 py-0.5 rounded">판매여부 Yes</span>
        </div>
        <div className="bg-white border border-line rounded overflow-hidden">
          <div className="px-4 py-2.5 border-b border-line bg-page font-semibold text-sm">프로모션 상세 (Condition)</div>
          <div className="p-4 text-sm">
            <DRow k="프로모션 이름" v="여름 단거리 인바운드 성수기 선점" />
            <DRow k="프로모션 타입" v="정률 할인 (Rate)" />
            <DRow k="판매 개시" v={<span className="text-green-700 font-semibold">Yes</span>} />
            <DRow k="예약 시작 ~ 종료일" v="2026-06-18 ~ 2026-08-31  ·  요일: All" />
            <DRow k="체크인 시작 ~ 종료일" v="2026-07-01 ~ 2026-08-31  ·  요일: All" />
            <DRow k="환불 불가 여부" v="No (요금제 취소 정책 따름)" />
            <DRow k="구성 프로모션" v={<span>2건 — ① 얼리버드 <b className="text-omgdeep">정률 -7%</b> &nbsp;·&nbsp; ② 연박 3박+ <b className="text-omgdeep">정률 -5%</b></span>} />
            <DRow k="할인 방식" v="정률 (Rate, %) · KRW · 실제 extranet은 할인값 단일이라 프로모션 2건으로 설정" />
            <DRow k="공급자 비고" v="OHMY Monthly Brief Vol.20 기반 자동 설정" />
          </div>
        </div>
        <div className="bg-white border border-line rounded overflow-x-auto">
          <div className="px-4 py-2.5 border-b border-line bg-page font-semibold text-sm">적용 대상 객실타입 · 플랜 <span className="text-mute font-normal">({PLANS.length*PROMOS.length}건 · 플랜 {PLANS.length} × 프로모션 {PROMOS.length})</span></div>
          <table className="w-full text-xs whitespace-nowrap">
            <thead className="bg-page text-mute"><tr>
              {["객실타입명(영어)","플랜명(영어)","Rate","ELLIS 플랜코드","프로모션유형","프로모션명(영어)","예약기간","체크인기간","적용값","판매여부"].map(h=><th key={h} className="px-3 py-2 text-left font-semibold border-b border-line">{h}</th>)}
            </tr></thead>
            <tbody className="divide-y divide-line">
              {PLANS.map((pl,i)=> PROMOS.map((pr,j)=>(
                <tr key={i+"-"+j} className="hover:bg-page">
                  <td className="px-3 py-2 font-medium">{pl.room}</td>
                  <td className="px-3 py-2">{pl.plan}</td>
                  <td className="px-3 py-2">{pl.rate}</td>

                  <td className="num px-3 py-2">06/18~08/31</td>
                  <td className="num px-3 py-2">07/01~08/31</td>

        <>
        <div className="bg-white border border-line rounded p-3 flex flex-wrap items-center gap-3">
          <Field label="호텔"><Sel w="w-44" opts={["TEST HOTEL"]} /></Field>
          <Field label="객실 타입"><Sel opts={["All"]} /></Field>
          <Field label="프로모션 타입"><Sel opts={["All"]} /></Field>
          <Field label="판매 개시"><Sel w="w-20" opts={["Yes"]} /></Field>
          <OBtn>검색</OBtn><OBtn gray>초기화</OBtn>
        </div>

          <p>No records available.</p>
          <p className="text-sm mt-1">Monthly Brief 제안을 적용하면 프로모션이 설정되어 여기에 표시됩니다.</p>
        </div>
        </>
      )}
    </div>

}

function Screen({id, applied, onOpenProposal, notify}){
  switch(id){
    case "booking": return <Bookings/>;
    case "dash": return <Dashboard/>;
    case "rate": return <Rate/>;
    case "brief": return <Brief onOpenProposal={onOpenProposal} notify={notify}/>;
    case "promo": return <Promotions applied={applied} onOpenProposal={onOpenProposal}/>;
    default: return <Generic label={MENU.concat([{id:"staff",label:"직원 목록"}]).find(m=>m.id===id)?.label || id} />;
  }
}

function App(){
  const [tabs,setTabs] = useState(["booking"]);
  const [active,setActive] = useState("booking");
  const [supOpen,setSupOpen] = useState(true);
  const open = (id)=>{ setTabs(t=>t.includes(id)?t:[...t,id]); setActive(id); };
  const close = (id,e)=>{ e.stopPropagation(); setTabs(t=>{ const n=t.filter(x=>x!==id); if(active===id) setActive(n[n.length-1]||""); return n; }); };
  const [proposal,setProposal] = useState(false);
  const [applied,setApplied] = useState(false);
  const [toast,setToast] = useState("");
  useEffect(()=>{
    const params = new URLSearchParams(window.location.search);
    const action = params.get("action"), qtab = params.get("tab");
    if(qtab==="brief"){ open("brief"); return; }
    if(action==="promo"){ open("brief"); setProposal(true); setToast("이메일에서 연결됨 · ‘지금 적용’ 한 번으로 설정이 완료됩니다"); setTimeout(()=>setToast(""),4500); return; }
    const t=setTimeout(()=>setProposal(true),1200); return ()=>clearTimeout(t);
  },[]);
  const openProposal = ()=>setProposal(true);
  const notify = (m)=>{ setToast(m); setTimeout(()=>setToast(""),3000); };
  const applyPromo = ()=>{ setApplied(true); setProposal(false); setToast("프로모션이 적용되었습니다 · 연동 채널 반영 중"); setTimeout(()=>setToast(""),3200); };
  return (
    <div className="flex h-screen overflow-hidden text-[13px]">
      {/* sidebar */}
      <aside className="w-56 bg-side text-gray-300 flex flex-col shrink-0">
        <div className="h-14 flex items-center gap-2 px-4 border-b border-white/10 bg-black/30">
          <span className="text-white">{I.menu}</span>
          <span className="text-white font-extrabold tracking-wide text-sm">OHMYHOTEL<span className="text-omg">&CO</span></span>
        </div>
        <div className="p-2"><div className="flex items-center gap-2 bg-white/5 rounded px-2 py-1.5 text-xs text-gray-400"><span>{I.search}</span>메뉴 이름을 입력해 주세요</div></div>
        <button onClick={()=>setSupOpen(!supOpen)} className="mx-2 mb-1 flex items-center justify-between bg-omg text-white px-3 py-2 rounded text-sm font-bold">
          <span className="flex items-center gap-2">{I.doc}공급사</span>{supOpen?I.chevU:I.chevD}
        </button>
        <nav className="flex-1 overflow-y-auto px-2 pb-2">
          {supOpen && MENU.map(m=>(
            <button key={m.id} onClick={()=>open(m.id)} className={cls("w-full flex items-center justify-between px-3 py-2 rounded text-sm text-left", active===m.id?"text-omg font-semibold bg-white/5":"text-gray-300 hover:bg-sidehover")}>
              <span>{m.label}</span>
              {m.isNew && <span className="text-[9px] font-bold bg-green-600 text-white px-1 py-0.5 rounded">NEW</span>}
            </button>
          ))}
          <div className="mt-3 px-3 py-2 text-xs text-gray-500 flex items-center gap-2 border-t border-white/10">회원 목록</div>
          <button onClick={()=>open("staff")} className={cls("w-full text-left px-3 py-2 rounded text-sm", active==="staff"?"text-omg font-semibold bg-white/5":"text-gray-300 hover:bg-sidehover")}>직원 목록</button>
        </nav>
      </aside>

      {/* main */}
      <div className="flex-1 flex flex-col min-w-0">
        <header className="h-14 bg-white border-b border-line flex items-center justify-end px-5 gap-4 text-sm shrink-0">
          <span className="flex items-center gap-1 text-mute">{I.globe}한국어</span>
          <span className="text-ink font-medium">tram.tt@ohmyhotel.com</span>
          <span className="text-mute">|</span><button className="text-mute hover:text-ink">비밀번호 변경</button>
          <button className="text-mute hover:text-ink">로그아웃</button>
        </header>
        {/* tab bar */}
        <div className="bg-white border-b border-line flex items-end gap-1 px-3 pt-2 shrink-0 overflow-x-auto">
          {tabs.map(id=>(
            <button key={id} onClick={()=>setActive(id)} className={cls("flex items-center gap-2 px-4 py-2 rounded-t text-sm whitespace-nowrap border border-b-0", active===id?"bg-page border-line text-ink font-semibold -mb-px":"bg-white border-transparent text-mute hover:bg-page")} style={active===id?{borderTop:"2px solid #F47920"}:{}}>
              {TAB_LABEL[id]||id}<span onClick={(e)=>close(id,e)} className="text-mute hover:text-red">{I.x}</span>
            </button>
          ))}
        </div>
        <main className="flex-1 overflow-y-auto p-5 bg-page">
          {active ? <Screen id={active} applied={applied} onOpenProposal={openProposal} notify={notify}/> : <div className="text-center text-mute mt-20">열린 탭이 없습니다. 좌측 메뉴를 선택하세요.</div>}
        </main>
        <footer className="bg-white border-t border-line px-5 py-3 text-xs text-mute shrink-0 flex justify-between">
          <span>Customer Center : +82-2-733-0550 (Weekday 09:00 ~ 18:00 except holidays / UTC +09:00)</span>
          <span>© 2025 OHMYHOTEL GLOBAL PTE. LTD.</span>
        </footer>
      </div>
      {proposal && <PromoModal onApply={applyPromo} onClose={()=>setProposal(false)} goBrief={()=>{ open("brief"); setProposal(false); }} />}
      {!proposal && <button onClick={openProposal} className="fixed bottom-6 right-6 z-40 flex items-center gap-2 bg-omg text-white px-4 py-3 rounded-full shadow-lg hover:bg-omgdeep text-sm font-semibold">💡 Brief 제안{!applied && <span className="bg-white text-omgdeep rounded-full w-5 h-5 text-xs font-bold flex items-center justify-center">1</span>}</button>}
      {toast && <div className="fixed bottom-24 right-6 z-50 bg-side text-white text-sm px-4 py-3 rounded-lg shadow-lg fade flex items-center gap-2">✓ {toast}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
