<style>
  body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; }
  .num { font-variant-numeric: tabular-nums; }
  .kick { text-transform: uppercase; letter-spacing: 0.18em; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #EDE7DF; border-radius: 4px; }
  .fade { animation: fd .25s ease; }
  @keyframes fd { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: none;} }
  .stripe { background-image: repeating-linear-gradient(45deg, #FFF1E6, #FFF1E6 5px, #fff 5px, #fff 10px); }

<body class="bg-cream text-ink">
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;
const won = (n) => "₩" + (n ?? 0).toLocaleString("ko-KR");
const cls = (...a) => a.filter(Boolean).join(" ");

/* ---------- icons (Lucide-style line) ---------- */
const Ic = ({ d, s = 18, c = "" }) => (

);
const I = {
  sun: <Ic d={<><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></>} />,
  grid: <Ic d={<><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></>} />,
  pulse: <Ic d={<><path d="M3 12h4l3 8 4-16 3 8h4"/></>} />,
  heart: <Ic d={<><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 1 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></>} />,
  bulb: <Ic d={<><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12c.7.7 1 1.3 1 2h6c0-.7.3-1.3 1-2a7 7 0 0 0-4-12z"/></>} />,
  trend: <Ic d={<><path d="M3 3v18h18"/><path d="M7 14l3-3 4 4 5-6"/></>} />,
  news: <Ic d={<><path d="M4 4h13v16H6a2 2 0 0 1-2-2V4z"/><path d="M17 8h3v10a2 2 0 0 1-2 2M8 8h6M8 12h6M8 16h4"/></>} />,
  cal: <Ic d={<><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></>} />,
  layers: <Ic d={<><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></>} />,
  tag: <Ic d={<><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1.5"/></>} />,
  pct: <Ic d={<><path d="M19 5 5 19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></>} />,
  moon: <Ic d={<><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></>} />,
  bed: <Ic d={<><path d="M2 8v12M2 12h18a2 2 0 0 1 2 2v6M2 16h20M6 12V9a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></>} />,
  content: <Ic d={<><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-5-5L5 21"/></>} />,
  book: <Ic d={<><path d="M2 7l10 6 10-6"/><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M6 21h12"/></>} />,
  chat: <Ic d={<><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></>} />,
  star: <Ic d={<><path d="m12 2 3 7 7 .5-5.5 4.5L18 21l-6-3.5L6 21l1.5-7L2 9.5 9 9z"/></>} />,
  wallet: <Ic d={<><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 14h2"/></>} />,
  crown: <Ic d={<><path d="M2 6l4 4 6-7 6 7 4-4v12H2V6z"/></>} />,
  building: <Ic d={<><rect x="4" y="2" width="16" height="20" rx="1"/><path d="M9 22v-4h6v4M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/></>} />,
  bank: <Ic d={<><path d="M3 21h18M3 10h18M5 6l7-3 7 3M4 10v11M20 10v11M8 10v11M12 10v11M16 10v11"/></>} />,
  doc: <Ic d={<><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></>} />,
  users: <Ic d={<><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/></>} />,
  help: <Ic d={<><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2.5-3 4M12 17h.01"/></>} />,
  bell: <Ic d={<><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></>} />,
  search: <Ic d={<><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></>} />,
  plus: <Ic d={<><path d="M12 5v14M5 12h14"/></>} />,
  check: <Ic d={<><path d="M20 6 9 17l-5-5"/></>} />,
  up: <Ic d={<><path d="M12 19V5M5 12l7-7 7 7"/></>} />,
  down: <Ic d={<><path d="M12 5v14M19 12l-7 7-7-7"/></>} />,
  bolt: <Ic d={<><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></>} />,
  copy: <Ic d={<><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></>} />,
  warn: <Ic d={<><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></>} />,
  chevD: <Ic d={<><path d="m6 9 6 6 6-6"/></>} s={16} />,
};

/* ---------- primitives ---------- */
const Kicker = ({ children, c="text-orange-deep" }) => <p className={cls("kick text-[10px] font-bold", c)}>{children}</p>;
const Card = ({ className="", children }) => <div className={cls("bg-white rounded-xl border border-hair", className)}>{children}</div>;
const Stage = ({ s }) => {
  if (!s) return null;
  const m = { "1ST":"bg-orange-soft text-orange-deep", "NEW":"bg-green text-white", "EXT":"bg-green-soft text-green-deep" };
  return <span className={cls("kick text-[9px] font-bold px-1.5 py-0.5 rounded", m[s])} style={{letterSpacing:"0.08em"}}>{s}</span>;
};
const Btn = ({ variant="primary", icon, children, onClick, className="" }) => {
  const m = {
    primary: "bg-orange text-white hover:bg-orange-deep",
    green: "bg-green text-white hover:bg-green-deep",
    ghost: "bg-white text-ink2 border border-hair hover:bg-cream",
    soft: "bg-orange-soft text-orange-deep hover:bg-orange/20",
  };
  return <button onClick={onClick} className={cls("inline-flex items-center justify-center gap-1.5 px-3.5 py-2 rounded-lg text-sm font-semibold transition", m[variant], className)}>{icon}{children}</button>;
};
function PageHeader({ kicker, title, sub, stage }) {
  return (
    <div className="mb-5 flex items-start justify-between">
      <div>
        <Kicker>{kicker}</Kicker>
        <div className="flex items-center gap-2 mt-1">
          <h1 className="text-[26px] font-bold leading-tight">{title}</h1>
          <Stage s={stage} />
        </div>
        {sub && <p className="text-sm text-mute mt-1">{sub}</p>}
      </div>
    </div>
  );
}
function KpiCard({ label, value, delta, dir, sub }) {
  const dc = dir === "up" ? "text-green" : dir === "down" ? "text-orange-deep" : "text-mute";
  return (
    <Card className="p-4">
      <p className="kick text-[10px] text-mute font-semibold">{label}</p>
      <p className="num text-[26px] font-extrabold text-orange-deep mt-1 leading-none">{value}</p>
      <div className="flex items-center gap-1 mt-1.5">
        {delta && <span className={cls("num text-xs font-bold flex items-center", dc)}>{dir==="up"?I.up:dir==="down"?I.down:null}{delta}</span>}
        {sub && <span className="text-xs text-mute">{sub}</span>}
      </div>
    </Card>
  );
}
const accentColor = { BEST:"orange", GOOD:"green", NEW:"green", QUICK:"orange", EASY:"green" };
function OppCard({ category, accent, title, why, impact, impactSub, cta, onApply }) {
  const col = accentColor[accent] || "orange";
  const stripe = col === "green" ? "bg-green" : "bg-orange";
  const btn = col === "green" ? "green" : "primary";
  return (
    <Card className="overflow-hidden flex">
      <div className={cls("w-1.5 shrink-0", stripe)}></div>
      <div className="flex-1 p-4 flex flex-col md:flex-row gap-4">
        <div className="flex-1">
          <div className="flex items-center gap-2 mb-1.5">
            <span className="kick text-[9px] font-bold text-mute">{category}</span>
            <span className={cls("kick text-[9px] font-bold px-1.5 py-0.5 rounded", col==="green"?"bg-green-soft text-green-deep":"bg-orange-soft text-orange-deep")}>{accent}</span>
          </div>
          <p className="font-bold text-[15px] mb-1.5">{title}</p>
          <ul className="space-y-0.5">
            {why.map((w,i)=><li key={i} className="text-xs text-mute flex gap-1.5"><span className="text-orange">•</span>{w}</li>)}
          </ul>
        </div>
        <div className="md:w-44 shrink-0 md:border-l md:border-hair md:pl-4 flex flex-col justify-between">
          <div>
            <p className="kick text-[9px] text-mute font-semibold">예상 임팩트</p>
            <p className="num text-lg font-extrabold text-green">{impact}</p>
            <p className="text-[11px] text-mute">{impactSub}</p>
            <p className="text-[10px] text-mute mt-1">검토 → 승인 → 약 5분 내 반영</p>
          </div>
          <Btn variant={btn} className="mt-2 w-full" icon={I.bolt} onClick={onApply}>{cta}</Btn>
        </div>
      </div>
    </Card>
  );
}
const Callout = ({ label, text, accent="orange" }) => {
  const o = accent === "green";
  return (
    <div className={cls("flex rounded-xl overflow-hidden", o?"bg-green-soft":"bg-orange-soft")}>
      <div className={cls("w-1.5 shrink-0", o?"bg-green":"bg-orange")}></div>
      <div className="p-4">
        <Kicker c={o?"text-green-deep":"text-orange-deep"}>{label}</Kicker>
        <p className="text-sm text-ink2 mt-1">{text}</p>
      </div>
    </div>
  );
};
const DarkBlock = ({ label, children }) => (
  <div className="rounded-xl p-6" style={{ background:"#1F1A17" }}>
    <Kicker c="text-orange">{label}</Kicker>
    <div className="mt-2 text-sm" style={{ color:"#D4CFC8" }}>{children}</div>
  </div>
);
const PermDot = ({ perm }) => {
  const m = { self:["bg-green","직접 수정"], approval:["bg-orange","승인 필요"], admin:["bg-mute","열람 전용"] };
  const [c,l] = m[perm];
  return <span className="inline-flex items-center gap-1 text-[11px] text-mute"><span className={cls("w-2 h-2 rounded-full", c)}></span>{l}</span>;
};
function Modal({ title, desc, onClose, children, wide }) {
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-ink/40 p-4" onClick={onClose}>
      <div className={cls("bg-white rounded-2xl shadow-xl w-full fade", wide?"max-w-2xl":"max-w-md")} onClick={(e)=>e.stopPropagation()}>
        <div className="p-5 border-b border-hair"><h3 className="text-lg font-bold">{title}</h3>{desc&&<p className="text-sm text-mute mt-1">{desc}</p>}</div>
        <div className="p-5">{children}</div>
      </div>
    </div>
  );
}
const Row = ({ k, v }) => <div className="flex justify-between text-sm"><span className="text-mute">{k}</span><span className="num font-semibold">{v}</span></div>;

/* ============================================================ SCREENS */

/* ---- Today (1ST) ---- */
function Today({ go, notify }) {
  const [insight, setInsight] = useState(true);
  const hero = [
    { label:"오늘 체크인", value:"18", sub:"건", icon:I.book },
    { label:"오늘밤 점유율", value:"62%", dir:"up", delta:"+4%", icon:I.moon },
    { label:"이번주 매출 (vs 지난주)", value:won(31200000), dir:"up", delta:"+12%", icon:I.trend },
  ];
  return (
    <div className="space-y-5 fade">
      <Card className="p-5 flex flex-col md:flex-row md:items-center md:justify-between gap-4" >
        <div>
          <Kicker>아침 브리핑 · 수요일</Kicker>
          <h1 className="text-[26px] font-bold mt-1">안녕하세요, 오마이호텔 명동 👋</h1>
          <p className="text-sm text-mute mt-0.5 flex items-center gap-1">{I.sun} 맑음 24° · 오늘 처리할 일을 30초 안에 확인하세요.</p>
        </div>
        <div className="grid grid-cols-3 gap-3">
          {hero.map((h)=>(
            <div key={h.label} className="text-center px-3">
              <p className="num text-2xl font-extrabold text-orange-deep">{h.value}<span className="text-sm text-mute font-bold">{h.sub||""}</span></p>
              <p className="text-[11px] text-mute mt-0.5">{h.label}</p>
              {h.delta&&<p className={cls("num text-[11px] font-bold", h.dir==="up"?"text-green":"text-orange-deep")}>{h.delta}</p>}
            </div>
          ))}
        </div>
      </Card>

      <div>
        <div className="flex items-center justify-between mb-2">
          <h3 className="font-bold flex items-center gap-1.5">{I.bulb} 오늘의 기회 <span className="text-xs text-mute font-normal">임팩트순 Top 3</span></h3>
          <button onClick={()=>go("opp")} className="text-sm font-semibold text-orange-deep">전체 보기 →</button>
        </div>
        <div className="space-y-3">
          <OppCard category="PROMOTION" accent="BEST" title="주말(6/13~14) 막판 특가 15% 적용" why={["점유율 41% — 컴프셋 평균 대비 18%p 낮음","주말 검색량 +32% 상승 중","적용 시 예약 전환 +2.3%p 기대"]} impact={"+"+won(1800000)} impactSub="주말 2일 예상 추가 매출" cta="지금 적용" onApply={()=>notify("프로모션 적용됨 · 48개 채널 반영 중")} />
          <OppCard category="AVAILABILITY" accent="QUICK" title="6/20~22 디럭스 객실 할당 +5 오픈" why={["3개 채널에서 매진 처리됨","해당 기간 수요 'PEAK' 등급","마감 해제 시 노출 회복"]} impact="+8건" impactSub="예상 추가 예약" cta="할당 열기" onApply={()=>notify("할당이 오픈되었습니다 · 동기화 시작")} />
          <OppCard category="CONTENT" accent="EASY" title="객실 사진 3장 추가 업로드" why={["필수 사진 10장 중 7장만 등록","사진 완성 호텔은 조회수 +21%","Property Health +6점 기대"]} impact="+6점" impactSub="Property Health" cta="사진 업로드" onApply={()=>go("content")} />
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <Card className="p-5">
          <h3 className="font-bold mb-3">처리할 일</h3>
          <div className="divide-y divide-hair">
            {[["미컨펌 예약 2건","마감 SLA 24시간","bookings","orange"],["미응답 리뷰 3건","평균 응답 2일","reviews","green"],["계약 만료 D-45","Contract Vault","contract","orange"],["누락 콘텐츠 알림","사진 3장 부족","content","green"]].map(([t,s,to,c],i)=>(
              <button key={i} onClick={()=>go(to)} className="w-full flex items-center justify-between py-2.5 text-left hover:bg-cream rounded-lg px-2 -mx-2">
                <div className="flex items-center gap-2"><span className={cls("w-2 h-2 rounded-full", c==="orange"?"bg-orange":"bg-green")}></span><span className="text-sm">{t}</span></div>
                <span className="text-xs text-mute">{s}</span>
              </button>
            ))}
          </div>
        </Card>
        {insight && (
          <Card className="p-5 relative">
            <button onClick={()=>setInsight(false)} className="absolute top-3 right-3 text-mute text-xs">닫기 ✕</button>
            <Kicker c="text-green-deep">HARE NEWS · 실시간 시장</Kicker>
            <p className="font-bold mt-2">중화권 6월 방한 수요 급증 — 명동 권역 직접 영향</p>
            <p className="text-sm text-mute mt-1">Ctrip·Meituan 검색량이 전주 대비 +28%. 귀 호텔 권역 수요가 'PEAK'로 전환되었습니다.</p>
            <Btn variant="green" className="mt-3" icon={I.bolt} onClick={()=>go("demand")}>수요 예측 보기</Btn>
          </Card>
        )}
      </div>
    </div>

}

/* ---- Performance (1ST) ---- */
function Performance() {
  const [range, setRange] = useState("30");
  const [cmp, setCmp] = useState("직전 기간");
  const k = [
    { label:"예약", value:"412", delta:"+8%", dir:"up", sub:"건" },
    { label:"ADR", value:won(132000), delta:"+5%", dir:"up" },
    { label:"매출", value:won(54400000), delta:"+12%", dir:"up" },
    { label:"점유율", value:"68%", delta:"-3%", dir:"down" },
    { label:"취소율", value:"9.2%", delta:"-1.1%", dir:"up" },
    { label:"전환율", value:"3.4%", delta:"+0.3%", dir:"up" },
  ];
  const ch = [["Ctrip Korea",38],["Agoda",22],["Booking",16],["Direct",14],["Meituan",10]];
  return (
    <div className="space-y-5 fade">
      <PageHeader kicker="INSIGHT · 성과 분석" title="Performance" stage="1ST" sub="기간별 6대 지표를 분석합니다. Today와 달리 심층 리뷰용입니다." />
      <Card className="p-3 flex flex-wrap items-center gap-2 justify-between">
        <div className="flex gap-1.5">
          {["7","14","30","90","365"].map((r)=>(
            <button key={r} onClick={()=>setRange(r)} className={cls("num px-3 py-1.5 rounded-lg text-sm font-semibold", range===r?"bg-orange text-white":"bg-white border border-hair text-ink2 hover:bg-cream")}>{r}일</button>
          ))}
        </div>
        <div className="flex gap-1.5">
          {["직전 기간","전년 동기"].map((c)=>(

      </Card>

          <h3 className="font-bold mb-3">채널별 TTV</h3>
          {ch.map(([n,v])=>(

/* ---- Channel Matrix (1ST) ---- */
function ChannelMatrix({ notify }) {
  const [heat, setHeat] = useState(false);
  const chans = ["Ctrip Korea","Agoda","Dida","Meituan","Booking","Direct"];
  const dates = ["6/12","6/13","6/14","6/15","6/16"];
  const base = 132;
  const grid = dates.map((d,r)=> chans.map((c,k)=>{
    const adr = base + ((r*3+k*5)%9) - 3 + (k===2?6:0);
    const allot = (r+k)%4;
    const parity = Math.abs(adr-base) > base*0.02 && (k===2||k===3);
    return { adr, allot, parity, active: !(k===2 && r>2) };
  }));
  return (
    <div className="space-y-4 fade">
      <PageHeader kicker="INVENTORY · 채널 매트릭스" title="Channel Matrix" stage="1ST" sub="날짜 × 채널 그리드. 48개 채널을 한 화면에서 — 패리티 위반·채널 오버라이드 관리." />
      <Card className="p-3 flex items-center justify-between">
        <p className="text-sm text-mute">단위: ADR(천원) / 잔여 재고 · <span className="text-orange-deep font-semibold">주황 테두리 = 패리티 위반 (±2%)</span></p>
        <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={heat} onChange={(e)=>setHeat(e.target.checked)} className="accent-orange" /> 패리티 히트맵</label>
      </Card>
      <Card className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead><tr className="bg-cream"><th className="text-left font-semibold px-4 py-2.5 text-mute">날짜</th>{chans.map((c)=><th key={c} className="text-center font-semibold px-3 py-2.5 whitespace-nowrap">{c}</th>)}</tr></thead>
          <tbody className="divide-y divide-hair">
            {grid.map((row,r)=>(
              <tr key={r}>
                <td className="num font-semibold px-4 py-2 text-mute">{dates[r]}</td>
                {row.map((cell,k)=>(
                  <td key={k} className="px-2 py-1.5">
                    {cell.active ? (
                      <div className={cls("num rounded-lg text-center py-1.5 px-1 cursor-pointer", cell.parity?"border-2 border-orange-deep":"border border-hair", heat&&cell.parity?"bg-orange-soft":"bg-white hover:bg-cream")} title={cell.parity?"패리티 위반":""} onClick={()=>notify(dates[r]+" · "+chans[k]+" 셀 편집")}>
                        <div className="font-bold">{cell.adr}</div>
                        <div className={cls("text-[11px]", cell.allot===0?"text-orange-deep":"text-mute")}>{cell.allot===0?"마감":"재고 "+cell.allot}</div>
                      </div>
                    ) : <div className="text-center text-mute text-xs py-2">—</div>}
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </Card>
      <p className="text-xs text-mute">빈 셀(—) = 해당 날짜 비활성 채널 · 셀 클릭 시 인라인 편집</p>
    </div>
  );
}

/* ---- Discount Stack Simulator (NEW) ---- */
function DiscountStack() {
  const discounts = [["Basic",5],["Early Bird",10],["Mobile",5],["Genius",10],["Country Special",8],["Long Stay",12],["Last Minute",15]];
  const [on, setOn] = useState({ "Basic":true, "Genius":true });
  const base = 150000;
  const steps = [];
  let price = base;
  discounts.forEach(([n,r])=>{ if(on[n]){ const cut = Math.round(price*r/100); price -= cut; steps.push([n,r,cut,price]); } });
  const eff = Math.round((1-price/base)*1000)/10;
  const safe = eff <= 22;
  const stackCount = steps.length;
  return (
    <div className="space-y-4 fade">
      <PageHeader kicker="INVENTORY · 할인 시뮬레이터" title="Discount Stack Simulator" stage="NEW" sub="채널·프로모션 누적 할인을 시뮬레이션해 마진 침식을 사전에 방지합니다." />

        <Card className="p-5">
          <h3 className="font-bold mb-3">할인 레이어 (7종)</h3>
          <div className="space-y-2">
            {discounts.map(([n,r])=>(
              <label key={n} className={cls("flex items-center justify-between p-3 rounded-lg border cursor-pointer", on[n]?"border-orange bg-orange-soft":"border-hair")}>
                <span className="flex items-center gap-2 text-sm"><input type="checkbox" checked={!!on[n]} onChange={(e)=>setOn({...on,[n]:e.target.checked})} className="accent-orange" />{n}</span>
                <span className="num text-sm font-semibold text-mute">−{r}%</span>
              </label>
            ))}
          </div>
        </Card>
        <div className="space-y-4">
          <DarkBlock label="단계별 가격 계산">
            <div className="space-y-1.5 mt-1">

      case "brief": return <MonthlyBrief />;
      case "bookings": return <Bookings notify={notify} />;
      case "profile": return <Profile notify={notify} />;
      case "contract": return <Contract notify={notify} />;
      default: { const m=meta[screen]||{}; return <Soon title={m.label} kicker={(m.group||"")+" · "+(m.sub||"")} stage={m.stage} icon={m.icon} />; }
    }
  };
  return (
    <div className="flex min-h-screen">
      <aside className="w-64 bg-white border-r border-hair flex flex-col shrink-0">
        <div className="px-5 py-5 border-b border-hair flex items-center gap-2">
          <div className="w-8 h-8 rounded-full bg-orange flex items-center justify-center text-white font-bold">O</div>
          <div><p className="font-extrabold leading-tight tracking-wide text-sm">OHMYHOTEL&CO</p><p className="text-[11px] text-mute">Partner Extranet · v2.3</p></div>
        </div>
        <nav className="flex-1 p-3 space-y-4 overflow-y-auto">
          {NAV.map((g)=>(
            <div key={g.group}>
              <p className="px-3 mb-1.5"><span className="kick text-[10px] font-bold text-orange-deep">{g.group}</span><span className="block text-[10px] text-mute">{g.sub}</span></p>
              <div className="space-y-0.5">
                {g.items.map((n)=>{
                  const active = screen===n.id;
                  return (
                    <button key={n.id} onClick={()=>go(n.id)} className={cls("w-full flex items-center gap-2.5 pl-3 pr-2 py-2 rounded-lg text-sm font-medium transition border-l-2", active?"bg-orange-soft text-orange-deep border-orange":"border-transparent text-ink2 hover:bg-cream")}>
                      <span className="shrink-0">{n.icon}</span>
                      <span className="flex-1 text-left text-[13px]">{n.label}</span>
                      <Stage s={n.stage} />
                    </button>
                  );
                })}
              </div>
            </div>
          ))}
        </nav>
        <div className="p-4 border-t border-hair text-[10px] text-mute">PRD v1.0 · Master v2.3 프로토타입</div>
      </aside>

      <div className="flex-1 flex flex-col min-w-0">
        <header className="bg-white border-b border-hair px-6 py-3 flex items-center justify-between sticky top-0 z-30">
          <div className="relative">
            <select value={hotel} onChange={(e)=>setHotel(e.target.value)} className="appearance-none font-semibold bg-cream rounded-lg pl-3 pr-8 py-2 text-sm cursor-pointer border border-hair">
              {["오마이호텔 명동","오마이호텔 강남","오마이스테이 부산"].map((h)=><option key={h}>{h}</option>)}
            </select>
            <span className="absolute right-2 top-1/2 -translate-y-1/2 text-mute pointer-events-none">{I.chevD}</span>
          </div>
          <div className="flex items-center gap-3">
            <div className="hidden md:flex items-center gap-2 bg-cream border border-hair rounded-lg px-3 py-2 text-sm text-mute w-56">{I.search}<span>메뉴·예약 검색</span></div>
            <button className="relative p-2 rounded-lg hover:bg-cream text-mute">{I.bell}<span className="absolute top-1.5 right-1.5 w-2 h-2 bg-orange rounded-full"></span></button>
            <div className="w-9 h-9 rounded-full bg-orange-soft text-orange-deep flex items-center justify-center font-bold text-sm">JL</div>
          </div>
        </header>
        <main className="flex-1 p-6 max-w-[1184px] w-full mx-auto">{render()}</main>
      </div>

      {toast && <div className="fixed bottom-6 right-6 bg-ink text-white text-sm px-4 py-3 rounded-xl shadow-lg fade flex items-center gap-2 z-50"><span className="text-green">{I.check}</span>{toast}<span className="text-mute text-xs ml-2">되돌리기</span></div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
